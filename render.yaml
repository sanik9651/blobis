services:
  - type: web
    name: blobis
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./blobis.db"
      - key: WEBAPP_URL
        value: "https://blobis-gqla.onrender.com"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "10000"
      - key: HF_API_TOKEN
        sync: false