services:
  - type: web
    name: blobis
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "python backend.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
