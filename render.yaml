services:
  - type: web
    name: blobis
    env: node
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn backend:app --host 0.0.0.0 --port $PORT --log-level info"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./blobis.db"
      - key: WEBAPP_URL
        value: "https://blobis-gqla.onrender.com"
      - key: WEBHOOK_URL
        value: "https://blobis-gqla.onrender.com/webhook"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "10000"
      - key: HF_API_TOKEN
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false