services:
  - type: web
    name: blobis
    env: python
    region: frankfurt
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python backend.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: "sqlite:///./blobis.db"
      - key: WEBAPP_URL
        value: "https://blobis-gqla.onrender.com"
      - key: WEBHOOK_URL
        value: "https://blobis-gqla.onrender.com/webhook"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: "10000"
      - key: HF_API_TOKEN
        sync: false
