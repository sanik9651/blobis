services:
  - type: web
    name: blobis-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_all.py
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false # Установите этот URL после деплоя на Render.com, например, https://your-app-name.onrender.com
